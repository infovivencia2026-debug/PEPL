services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports: ['5433:5432']
    volumes: ['pepl-data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGHOST: db
      PGPORT: '5432'
      SUPER_USER: postgres
      SUPER_PASSWORD: postgres
      PEPL_DB: pepl
      OWNER_USER: pepl_owner
      OWNER_PASSWORD: ${OWNER_PASSWORD:?set OWNER_PASSWORD}
      APP_USER: pepl_app
      APP_PASSWORD: ${APP_PASSWORD:?set APP_PASSWORD}
      PORT: '4010'
    ports: ['4010:4010']
    # Migrations run on boot: the schema and the code that expects it ship together.
    command: >
      sh -c "node --experimental-strip-types scripts/bootstrap.ts &&
             node --experimental-strip-types src/db/migrate.ts &&
             node --experimental-strip-types src/http/server.ts"

volumes:
  pepl-data:
